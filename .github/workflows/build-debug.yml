name: 大嗓门之家-手机包

on:
  push:
    branches: [fongmi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受 Android SDK 协议
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: 生成临时签名（debug 验证用，每次编译随机，仅第一锅）
        run: |
          keytool -genkeypair -alias dabao -keyalg RSA -keysize 2048 \
            -validity 10000 -keystore debug.keystore -storepass 123456 \
            -keypass 123456 -dname "CN=dabao, OU=tv, O=dabao, C=CN"

      - name: 写入 local.properties（绕过上游强制 release 签名）
        run: |
          {
            echo "storeFile=$(pwd)/debug.keystore"
            echo "keyAlias=dabao"
            echo "storePassword=123456"
          } >> local.properties

      - name: 编译 mobile debug 包
        run: |
          chmod +x gradlew
          ./gradlew assembleMobileDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 手机包-debug
          path: app/build/outputs/apk/mobile/debug/*.apk
          retention-days: 14
